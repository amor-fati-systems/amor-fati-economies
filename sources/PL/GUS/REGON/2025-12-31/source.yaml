statistical_universe:
  unit: national-economy entity in the REGON register
  published_concept: registered entity declaring economic activity
  geography: Poland and voivodeships where published
  dimensions:
    - PKD 2007 activity classification
    - legal form
    - ownership sector
    - declared expected-worker band
intended_use:
  role: structural_prior
  supports:
    - the stock and composition of registered entities at the Q4 2025 boundary
    - a synthetic enterprise distribution by available geography, PKD 2007, and expected-worker band
  does_not_support:
    - realised employment, FTE, vacancies, or job capacity
    - a worker-to-enterprise or worker-to-establishment relation
    - a legal-enterprise identifier for a public synthetic baseline
forbidden_inferences:
  - Do not convert a declared expected-worker band into an observed number of employees or job slots.
  - Do not reconcile this register directly to BAEL without a declared bridge between their statistical universes.
  - Do not treat the registered seat or published activity as an observed workplace for every worker.
