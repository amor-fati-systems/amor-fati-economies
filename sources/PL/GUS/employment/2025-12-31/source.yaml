statistical_universe:
  unit: person employed in the national economy
  published_concept: persons counted once at their main job, including persons resident in Poland or abroad
  geography: Poland, voivodeships, powiats, and other published territorial aggregates
  dimensions:
    - PKD 2007 section
    - sex
    - seat of the entity of the main job
intended_use:
  role: structural_prior
  supports:
    - current aggregate allocation weights for synthetic workplaces by the published seat, PKD 2007 section, and sex dimensions
    - a declared bridge between the person-side BAEL population and synthetic main-employment attachments
  does_not_support:
    - the actual location where a person performs work
    - an establishment, employer, contract, FTE, vacancy, or person-level identifier
    - equality with BAEL employed-person totals without a declared universe bridge
forbidden_inferences:
  - Do not relabel the seat of the entity of the main job as an observed actual workplace.
  - Do not turn an aggregate seat-by-section cell into an observed worker-to-firm relation.
  - Do not force this administrative-statistics universe to equal the BAEL population.
