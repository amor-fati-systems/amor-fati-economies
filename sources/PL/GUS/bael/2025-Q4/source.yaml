intended_use:
  role: hard_control_candidate
  supports:
    - national labour-status margins in the publication's declared universe and age bands
    - selected national employment distributions by published activity classification
  does_not_support:
    - a complete voivodeship-by-sex-by-age-by-labour-status joint control
    - workplace voivodeship
    - a residence-to-workplace origin-destination matrix
    - person-to-firm assignments
forbidden_inferences:
  - Do not assign labour status to residents in collective accommodation from BAEL alone.
  - Do not split published age bands into finer hard-control cells without an explicit bridge.
  - Do not treat jobs, FTE, vacancies, or a published sector distribution as a person-to-firm relation.
